name: CI

on:
  push:
    # Sequence of patterns matched against refs/heads
    branches:
      - master
      - dev
      - features/* # all feature branches
      - bugfix/*
      - ci/* # all branches with the prefix 'ci/'
    # Sequence of patterns matched against refs/tags
    tags:
      - '*'
  pull_request:
    branches: [ "master" ]

# Superseded branch/PR runs are cancelled when a newer commit lands on the same
# ref. Tag (release) builds always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  GITHUB_TOKEN: ${{ secrets.CI_TOKEN }}
  NODE_OPTIONS: --max-old-space-size=8192
  VITE_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.VITE_PUBLIC_POSTHOG_PROJECT_TOKEN }}
  VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.VITE_PUBLIC_POSTHOG_HOST }}

jobs:
  # Builds the platform-independent part of the app (server/main esbuild
  # bundles, React renderer, pendant UI, default plugins) once. The packaging
  # jobs download it and only run electron-builder, which installs the
  # per-platform production deps (incl. native prebuilds) itself.
  build-web:
    name: Build web bundle
    runs-on: ubuntu-latest
    environment: CI
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Install dependencies
        # TODO: add --frozen-lockfile once yarn.lock is back in sync with
        # package.json (it currently isn't, so a frozen install fails).
        run: yarn install --prefer-offline
      - name: Sync package and install src deps
        run: |
          npm run package-sync
          yarn --cwd src install --production --ignore-scripts --non-interactive --prefer-offline
      - name: Prebuild (tag)
        if: github.ref_type == 'tag'
        run: npm run prebuild-prod
      - name: Prebuild (branch)
        if: github.ref_type == 'branch'
        run: npm run prebuild-latest
      - name: Build (tag)
        if: github.ref_type == 'tag'
        run: yarn run build
      - name: Build (branch)
        if: github.ref_type == 'branch'
        run: yarn run build-latest
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          # src/package.json carries the version stamped by prebuild; the
          # packaging jobs read it to name release assets.
          path: |
            dist/gsender
            src/package.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build-linux:
    name: Build Linux packages
    needs: build-web
    runs-on: ubuntu-latest
    environment: CI
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup packaging
        uses: ./.github/actions/setup-package
      - name: Build Linux binaries
        run: yarn run build:linux
      - name: Verify arm64 package has no host-arch native builds
        shell: bash
        run: |
          # Native modules must load from their per-arch prebuilds/. A build/Release
          # (compiled for the x64 runner) would shadow them and break arm64 users.
          bad=$(find output/linux-arm64-unpacked -name '*.node' -path '*build/Release*' -print)
          if [ -n "$bad" ]; then
            echo "Host-arch native builds leaked into the arm64 package:"; echo "$bad"; exit 1
          fi
          if find output/linux-arm64-unpacked -name '*.node' -path '*linux-arm64*' -exec file {} + | grep -q 'x86-64'; then
            echo "x86-64 binary found in arm64 prebuilds"; exit 1
          fi
          echo "Native modules in arm64 package:"
          find output/linux-arm64-unpacked -name '*.node' -path '*linux-arm64*' -exec file {} +
      - name: Prepare release assets
        shell: bash
        run: |
          GIT_COMMIT_LOG=`git log -1 --format='%ci %H %s'`
          PACKAGE_NAME=`node -e "console.log(require('./src/package.json').name)"`
          PACKAGE_VERSION=`node -e "console.log(require('./src/package.json').version)"`
          mkdir -p releases/linux
          ls -al output
          cp -af "output/${PACKAGE_NAME}-${PACKAGE_VERSION}-x86_64.AppImage" "releases/linux/${PACKAGE_NAME}-${PACKAGE_VERSION}-Linux-Intel-64Bit.AppImage"
          cp -af "output/${PACKAGE_NAME}-${PACKAGE_VERSION}-amd64.deb" "releases/linux/${PACKAGE_NAME}-${PACKAGE_VERSION}-Linux-Intel-64Bit.deb"
          cp -af "output/${PACKAGE_NAME}-${PACKAGE_VERSION}-arm64.AppImage" "releases/linux/${PACKAGE_NAME}-${PACKAGE_VERSION}-Linux-ARM-64Bit.AppImage"
          cp -af "output/${PACKAGE_NAME}-${PACKAGE_VERSION}-arm64.deb" "releases/linux/${PACKAGE_NAME}-${PACKAGE_VERSION}-Linux-ARM-64Bit.deb"
          ls -al output releases/linux
          if [[ "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_REF_NAME" == "master" ]]; then
            yarn github-release delete \
              --owner=gSender \
              --repo=gsender \
              --tag="${GITHUB_REF_NAME}-latest" \
              --release-name="${GITHUB_REF_NAME}" \
              "*-linux*";
            yarn github-release upload \
              --owner=gSender \
              --repo=gsender \
              --tag="${GITHUB_REF_NAME}-latest" \
              --release-name="${GITHUB_REF_NAME}" \
              --body="${GIT_COMMIT_LOG}" \
              releases/linux/*;
          fi
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: releases/linux/*
          prerelease: true
          draft: true

  # One leg per arch so the two (slow) sign + notarize passes run in parallel
  # on separate runners instead of back to back.
  build-macos:
    needs: build-web
    name: Build macOS packages (${{ matrix.arch }})
    environment: CI
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            label: Mac-Intel
          - arch: arm64
            label: Mac-Silicon
    env:
      GH_TOKEN: ${{ secrets.CI_TOKEN }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      # Skip code signing for pull requests
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup packaging
        uses: ./.github/actions/setup-package
      - name: Build macOS binaries
        run: yarn run build:macos-${{ matrix.arch }}
      - name: Prepare release assets
        shell: bash
        run: |
          GIT_COMMIT_LOG=`git log -1 --format='%ci %H %s'`
          PACKAGE_NAME=`node -e "console.log(require('./src/package.json').name)"`
          PACKAGE_VERSION=`node -e "console.log(require('./src/package.json').version)"`
          mkdir -p releases/macos
          ls -al output
          cp -af "output/${PACKAGE_NAME}-${PACKAGE_VERSION}-${{ matrix.arch }}.dmg" "releases/macos/gSender-${PACKAGE_VERSION}-${{ matrix.label }}.dmg"
          ls -al output releases/macos
          if [[ "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_REF_NAME" == "master" ]]; then
            # Each leg only replaces its own asset so the parallel legs don't
            # delete each other's upload.
            yarn github-release delete \
              --owner=gSender \
              --repo=gsender \
              --tag="${GITHUB_REF_NAME}-latest" \
              --release-name="${GITHUB_REF_NAME}" \
              "*-${{ matrix.label }}*";
            yarn github-release upload \
              --owner=gSender \
              --repo=gsender \
              --tag="${GITHUB_REF_NAME}-latest" \
              --release-name="${GITHUB_REF_NAME}" \
              --body="${GIT_COMMIT_LOG}" \
              releases/macos/*;
          fi
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: releases/macos/*
          prerelease: true
          draft: true
      - name: Upload Mac Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac_artifact_${{ matrix.arch }}
          path: releases/macos/*.dmg
          compression-level: 0 # no compression
          retention-days: 2

  build-windows:
    needs: build-web
    name: Build Windows packages
    environment: CI
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Write client auth certificate
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $b64 = "${{ secrets.SM_CLIENT_CERT_FILE_BASE64 }}" -replace '\s', ''
          $certBytes = [Convert]::FromBase64String($b64)
          $certPath = "${{ github.workspace }}\sm_client_cert.p12"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          echo "SM_CLIENT_CERT_FILE=$certPath" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
      - name: Set up DigiCert SM Tools
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          SM_HOST: ${{ secrets.SM_HOST }}
        run: |
          curl -X GET "https://one.digicert.com/signingmanager/api-ui/v1/releases/smtools-windows-x64.msi/download" `
            -H "x-api-key:$env:SM_API_KEY" -o smtools.msi
          $msiPath = (Resolve-Path smtools.msi).Path
          $proc = Start-Process msiexec -ArgumentList "/i `"$msiPath`" /quiet /qn" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "msiexec failed with exit code $($proc.ExitCode)" }
          $smctl = Get-ChildItem "C:\Program Files", "C:\Program Files (x86)" -Recurse -Filter "smctl.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $smctl) { throw "smctl.exe not found after install" }
          $klPath = $smctl.DirectoryName
          Write-Host "smctl found at: $klPath"
          echo $klPath | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
          Set-Content -Path "C:\Windows\System32\pkcs11properties.cfg" -Value "curl_path=$klPath"
          [System.Environment]::SetEnvironmentVariable("SM_API_KEY",              $env:SM_API_KEY,              "Machine")
          [System.Environment]::SetEnvironmentVariable("SM_CLIENT_CERT_FILE",     $env:SM_CLIENT_CERT_FILE,     "Machine")
          [System.Environment]::SetEnvironmentVariable("SM_CLIENT_CERT_PASSWORD", $env:SM_CLIENT_CERT_PASSWORD, "Machine")
          [System.Environment]::SetEnvironmentVariable("SM_HOST",                 $env:SM_HOST,                 "Machine")
          & $smctl.FullName healthcheck
          & $smctl.FullName creds save $env:SM_API_KEY $env:SM_CLIENT_CERT_PASSWORD
          & $smctl.FullName windows certsync --keypair-alias="${{ secrets.SM_KEYPAIR_ALIAS }}"
      - name: Add signtool to PATH
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found in Windows SDK" }
          $signtool.DirectoryName | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
      - name: Setup packaging
        uses: ./.github/actions/setup-package
      - name: Build Windows binaries
        env:
          SM_API_KEY: ${{ startsWith(github.ref, 'refs/tags/') && secrets.SM_API_KEY || '' }}
          SM_CLIENT_CERT_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.SM_CLIENT_CERT_PASSWORD || '' }}
          SM_HOST: ${{ startsWith(github.ref, 'refs/tags/') && secrets.SM_HOST || '' }}
          SM_KEYPAIR_ALIAS: ${{ startsWith(github.ref, 'refs/tags/') && secrets.SM_KEYPAIR_ALIAS || '' }}
        run: yarn run build:windows
      - name: Prepare release assets
        shell: bash
        run: |
          GIT_COMMIT_LOG=`git log -1 --format='%ci %H %s'`
          PACKAGE_NAME=`node -e "console.log(require('./src/package.json').name)"`
          PACKAGE_VERSION=`node -e "console.log(require('./src/package.json').version)"`
          mkdir -p releases/windows
          ls -al output
          cp -af "output/${PACKAGE_NAME}-${PACKAGE_VERSION}-x64.exe" "releases/windows/gSender-${PACKAGE_VERSION}-Windows-64Bit.exe"
          # electron-updater's latest.yml references the artifact by electron-builder's
          # original (un-renamed) filename, and validates it against the matching
          # .blockmap for differential downloads. All three must be uploaded together,
          # under their original names, or auto-update breaks even though the
          # human-friendly renamed .exe above still downloads fine manually.
          cp -af "output/${PACKAGE_NAME}-${PACKAGE_VERSION}-x64.exe" "releases/windows/"
          cp -af "output/${PACKAGE_NAME}-${PACKAGE_VERSION}-x64.exe.blockmap" "releases/windows/"
          cp -af "output/latest.yml" "releases/windows/"
          ls -al output releases/windows
          if [[ "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_REF_NAME" == "master" ]]; then
            yarn github-release delete \
              --owner=gSender \
              --repo=gsender \
              --tag="${GITHUB_REF_NAME}-latest" \
              --release-name="${GITHUB_REF_NAME}" \
              "*-windows*" "*.exe" "*.blockmap" "latest.yml";
            yarn github-release upload \
              --owner=gSender \
              --repo=gsender \
              --tag="${GITHUB_REF_NAME}-latest" \
              --release-name="${GITHUB_REF_NAME}" \
              --body="${GIT_COMMIT_LOG}" \
              releases/windows/*;
          fi
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: releases/windows/*
          prerelease: true
          draft: true
      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows_artifact
          path: releases/windows/*.exe
          compression-level: 0 # no compression
          retention-days: 2
  build-pi:
    name: Build Raspberry PI packages
    runs-on: ubuntu-24.04-arm
    environment: CI
    env:
      GH_TOKEN: ${{ secrets.CI_TOKEN }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # docker-container builder, required for the GitHub Actions layer cache
      # used by scripts/build-pi.sh (--cache-from/--cache-to type=gha).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # Exposes ACTIONS_RUNTIME_TOKEN / cache URLs to run steps so the plain
      # `docker buildx build` in build-pi.sh can reach the gha cache backend.
      - name: Expose GitHub runtime for buildx cache
        uses: crazy-max/ghaction-github-runtime@v3
      - name: Build Pi binaries using docker
        shell: bash
        run: |
          scripts/build-pi.sh
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            releases/pi/*
          prerelease: true
          draft: true
