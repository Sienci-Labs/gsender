# gSender Pendant for Android: builds a debug APK (arm64-v8a only - physical
# arm64 tablets are the only target, no emulator/x86_64 build). See
# android/README.md.
#
# The Node.js runtime (android/node) is cross-compiled in the private repo
# Sienci-Labs/node_24_APK and published there as a release, tagged by
# android/scripts/node-runtime-tag.sh. This workflow only downloads it, using
# the NODE_RUNTIME_TOKEN secret (fine-grained PAT, Contents: read on that repo).
# After changing anything in android/node/, run node_24_APK's Build workflow
# with gsender_ref set to the new commit before this workflow can pass.
#
# Android is not part of gSender releases: this workflow never runs for tags or
# master and never publishes to GitHub Releases. APKs are Actions artifacts
# only. Do not add a release upload step.
name: Android
run-name: "Android — ${{ github.event.head_commit.message || github.ref_name }}"

on:
  push:
    branches: [dev, 'features/*', 'bugfix/*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode is the commit count, as for desktop branch builds.
          fetch-depth: 0

      - name: Download Node runtime
        env:
          GH_TOKEN: ${{ secrets.NODE_RUNTIME_TOKEN }}
        run: |
          tag=$(bash android/scripts/node-runtime-tag.sh)
          if ! gh release download "$tag" -R Sienci-Labs/node_24_APK -D "$RUNNER_TEMP/node-runtime"; then
            echo "::error::Node runtime $tag is not published. Run the Build workflow in Sienci-Labs/node_24_APK with gsender_ref=$GITHUB_SHA (takes 1-1.5 h), then re-run this job."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: yarn install --non-interactive

      - name: Build JS payload (server bundle + pendant UI)
        run: yarn android:payload

      - name: Install Node runtime
        run: yarn android:runtime "$RUNNER_TEMP/node-runtime"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        working-directory: android
        run: bash gradlew assembleDebug

      - name: Collect APK
        id: apks
        run: |
          version=$(node -p "require('./src/package.json').version")
          mkdir -p apks
          cp "android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk" "apks/gSender-Pendant-$version-Android-arm64-v8a-debug.apk"
          cp android/node-runtime/build-info-*.txt apks/ 2>/dev/null || true
          {
            echo "### gSender Pendant $version (Android, debug)"
            echo ""
            for f in apks/*.apk; do echo "- $(basename "$f"): $(( $(stat -c %s "$f") / 1048576 )) MB"; done
            echo "- Node runtime: $(head -1 android/node-runtime/build-info-arm64.txt)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: apks
          retention-days: 14
