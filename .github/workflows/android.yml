# gSender Pendant for Android: builds debug APKs (arm64-v8a, x86_64) and checks
# them on a 16 KB-page emulator. See android/README.md.
#
# The Node.js runtime (android/node) is cross-compiled here and kept in the
# Actions cache, keyed on android/node/**. A cache hit takes about a minute; a
# miss (runtime change, or cache evicted after 7 days unused) takes 1–1.5 h.
name: Android
run-name: "Android — ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.head_commit.message || github.ref_name }}"

on:
  push:
    branches: [master, dev, 'features/*', 'bugfix/*']
    tags: ['*']
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  node-runtime:
    name: Node runtime ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Read runtime.env
        id: env
        run: |
          source android/node/runtime.env
          echo "ndk=$NDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "key=android-node-$NODE_VERSION-${{ matrix.arch }}-${{ hashFiles('android/node/**') }}" >> "$GITHUB_OUTPUT"

      - name: Restore cached runtime
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/node-runtime
          key: ${{ steps.env.outputs.key }}

      - name: Set up NDK
        if: steps.cache.outputs.cache-hit != 'true'
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ steps.env.outputs.ndk }}
          add-to-path: false

      - name: Free disk space
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup && df -h /

      - name: Cross-compile Node (cache miss, 1–1.5 h)
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash android/node/build-node.sh ${{ matrix.arch }} "${{ steps.ndk.outputs.ndk-path }}" "$RUNNER_TEMP/node-work" "$RUNNER_TEMP/node-runtime"

      - name: Save runtime to cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/node-runtime
          key: ${{ steps.env.outputs.key }}

      - name: Summary
        run: |
          {
            echo "### Node runtime — ${{ matrix.arch }} ($([ '${{ steps.cache.outputs.cache-hit }}' = true ] && echo 'from cache' || echo 'built'))"
            echo '```'
            tar xzf "$RUNNER_TEMP"/node-runtime/*.tar.gz -O ./build-info.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: android-node-runtime-${{ matrix.arch }}
          path: ${{ runner.temp }}/node-runtime
          retention-days: 14

  build:
    name: Build APKs
    needs: node-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode is the commit count, as for desktop branch builds.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: yarn install --non-interactive

      - name: Build JS payload (server bundle + pendant UI)
        run: yarn android:payload

      - uses: actions/download-artifact@v4
        with:
          pattern: android-node-runtime-*
          path: ${{ runner.temp }}/node-runtime
          merge-multiple: true

      - name: Install Node runtime
        run: yarn android:runtime "$RUNNER_TEMP/node-runtime"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        working-directory: android
        run: bash gradlew assembleDebug

      - name: Collect APKs
        id: apks
        run: |
          version=$(node -p "require('./src/package.json').version")
          mkdir -p apks
          for abi in arm64-v8a x86_64; do
            cp "android/app/build/outputs/apk/debug/app-$abi-debug.apk" "apks/gSender-Pendant-$version-Android-$abi-debug.apk"
          done
          cp android/node-runtime/build-info-*.txt apks/ 2>/dev/null || true
          {
            echo "### gSender Pendant $version (Android, debug)"
            echo ""
            for f in apks/*.apk; do echo "- $(basename "$f"): $(( $(stat -c %s "$f") / 1048576 )) MB"; done
            echo "- Node runtime: $(head -1 android/node-runtime/build-info-arm64.txt)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: apks
          retention-days: 14

  emulator:
    name: Emulator (API 35, 16 KB pages)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: ${{ runner.temp }}/apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Locate x86_64 APK
        id: apk
        run: echo "path=$(ls "$RUNNER_TEMP"/apks/*x86_64*.apk)" >> "$GITHUB_OUTPUT"

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis_ps16k
          # The post-boot `settings put` the action uses to disable animations
          # failed on this image (docs/android/s1-node-runtime-findings.md).
          disable-animations: false
          ram-size: 4096M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash android/scripts/emulator-smoke.sh "${{ steps.apk.outputs.path }}" "${{ runner.temp }}/smoke"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-results
          path: ${{ runner.temp }}/smoke
          retention-days: 7
